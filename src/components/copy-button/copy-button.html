<span class="copy-button" data-copy-text="Text to copy" data-state="idle">
  <button type="button" class="copy-button__control">
    <span class="copy-button__content">
      <svg
        class="copy-button__copy-icon"
        viewBox="0 0 24 24"
        width="18"
        height="18"
        fill="none"
        aria-hidden="true"
      >
        <rect x="8" y="8" width="12" height="12" rx="2" />
        <path d="M15 8V5a2 2 0 0 0-2-2H5a2 2 0 0 0-2 2v8a2 2 0 0 0 2 2h3" />
      </svg>
      <svg
        class="copy-button__check-icon"
        viewBox="0 0 24 24"
        width="18"
        height="18"
        fill="none"
        aria-hidden="true"
      >
        <path d="m5 12 4 4L19 6" pathLength="1" stroke-dasharray="1" />
      </svg>
      <span class="copy-button__label">Copy</span>
    </span>
  </button>
  <span class="copy-button__message" role="status" aria-atomic="true"></span>
</span>
