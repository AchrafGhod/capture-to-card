<article class="cm-skeleton" data-ready="false" aria-busy="true">
  <div class="cm-skeleton__body" inert aria-hidden="true">
    <div class="cm-skeleton__slot cm-skeleton__media" style="--slot: 0">
      <img
        class="cm-skeleton__content"
        src="./image.svg"
        alt="A landscape"
        width="1200"
        height="720"
      />
      <span class="cm-skeleton__placeholder" aria-hidden="true"></span>
    </div>
    <div class="cm-skeleton__text">
      <div class="cm-skeleton__slot" style="--slot: 1">
        <h3 class="cm-skeleton__content">A moment of calm</h3>
        <span class="cm-skeleton__placeholder" aria-hidden="true"></span>
      </div>
      <div class="cm-skeleton__slot" style="--slot: 2">
        <p class="cm-skeleton__content">
          A quiet place to pause, explore and find your next idea.
        </p>
        <span class="cm-skeleton__placeholder" aria-hidden="true"></span>
      </div>
    </div>
  </div>
  <span class="cm-skeleton__status" role="status" aria-atomic="true"
    >Loading content…</span
  >
</article>
